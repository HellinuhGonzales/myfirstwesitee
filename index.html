<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Document Metadata & Mobile Viewport Configuration -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Princess Collene C. Palacio | Personal Portfolio</title>

  <!-- Google Fonts: Playfair Display (Headings) & Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Purple Palette & Typography Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            lavender: {
              50: '#FAF7FD',
              100: '#F2EBFA',
              200: '#E5D7F5',
              300: '#CFB5EC',
            },
            royal: {
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9',
              800: '#5B21B6',
              900: '#4C1D95',
            },
            plum: {
              900: '#1F142C',
              700: '#3E2D54',
              500: '#6B5884',
            }
          }
        }
      }
    };
  </script>

  <!-- Inline Custom Styles for Glassmorphism, Card Hover Depth & Animations -->
  <style>
    body {
      background-color: #FAF7FD;
      color: #1F142C;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .hero-backdrop {
      background:
        radial-gradient(circle at 85% 15%, rgba(124, 58, 237, 0.14), transparent 50%),
        radial-gradient(circle at 12% 85%, rgba(139, 92, 246, 0.12), transparent 55%),
        #FAF7FD;
    }

    .glass-nav {
      background: rgba(250, 247, 253, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .card-elevate {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    .card-elevate:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 34px -14px rgba(91, 33, 182, 0.2);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF7FD;
    }
    ::-webkit-scrollbar-thumb {
      background: #CFB5EC;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7C3AED;
    }
  </style>
</head>
